name: Deploy DFW PM2.5 dashboard to GitHub Pages

# This workflow is deliberately manual so enabling Pages cannot accidentally
# publish the dashboard or bundled data. See tceq_pm25_dashboard/DEPLOYMENT.md.
'on':
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "tceq-pm25-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install the static-site exporter
        run: Rscript --vanilla -e 'install.packages(c("digest", "shinylive"), repos = "https://cloud.r-project.org")'

      - name: Build and validate the Shinylive site
        run: >-
          Rscript --vanilla scripts/build_shinylive.R
          --cache-dir=tceq_pm25_dashboard/deploy_cache
          --output-dir=_site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
